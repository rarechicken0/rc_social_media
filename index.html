<style>
  /* Layout: single narrow column. RC MC avatar and name on top, then one tappable row per channel with its own profile picture. */
  :root {
    --bg: #f7f4f4;
    --fg: #1d1517;
    --muted: #6a5c5f;
    --card: #ffffff;
    --line: #e5dcde;
    --accent: #d1203a;
    --font: "Noto Sans Khmer", "Khmer OS Battambang", "Khmer UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #120b0d;
      --fg: #f6eef0;
      --muted: #ab9a9e;
      --card: #1c1215;
      --line: #33242a;
      --accent: #ff4b61;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #120b0d;
    --fg: #f6eef0;
    --muted: #ab9a9e;
    --card: #1c1215;
    --line: #33242a;
    --accent: #ff4b61;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  img { max-width: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    padding-block: 40px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100vh;
  }
  main { width: 100%; max-width: 440px; margin: 0 auto; }

  .profile { text-align: center; margin-bottom: 28px; }
  .avatar {
    display: block;
    width: 104px; height: 104px; border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 14px;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
  }
  h1 { font-size: 26px; font-weight: 700; line-height: 1.3; margin: 0; letter-spacing: .02em; }
  .bio { margin: 6px 0 0; color: var(--muted); font-size: 15px; text-wrap: balance; }

  .links { display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    color: inherit; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .link:hover { border-color: var(--accent); }
  .link:active { transform: scale(.985); }
  .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .pic { position: relative; flex: none; width: 54px; height: 54px; }
  .pic img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; display: block; }
  .badge {
    position: absolute; right: -5px; bottom: -5px;
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
    border: 2px solid var(--card);
  }
  .badge svg { width: 12px; height: 12px; }
  .b-yt { background: #e62117; }
  .b-tg { background: #229ed9; }
  .b-fb { background: #1877f2; }
  .b-web { background: #d1203a; }

  .text { min-width: 0; flex: 1; }
  .title { display: block; font-weight: 700; font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
  .sub { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .chev { flex: none; width: 18px; height: 18px; color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }

  @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
</style>
