<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>Bio Links</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;700&display=swap">
<style>
  /* Layout: single narrow column. RC MC avatar and name on top, then one tappable row per channel with its own profile picture. */
  :root {
    --bg: #f7f4f4;
    --fg: #1d1517;
    --muted: #6a5c5f;
    --card: #ffffff;
    --line: #e5dcde;
    --accent: #d1203a;
    --font: "Noto Sans Khmer", "Khmer OS Battambang", "Khmer UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #120b0d;
      --fg: #f6eef0;
      --muted: #ab9a9e;
      --card: #1c1215;
      --line: #33242a;
      --accent: #ff4b61;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #120b0d;
    --fg: #f6eef0;
    --muted: #ab9a9e;
    --card: #1c1215;
    --line: #33242a;
    --accent: #ff4b61;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    padding-block: 40px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100vh;
  }
  main { width: 100%; max-width: 440px; margin: 0 auto; }

  .profile { text-align: center; margin-bottom: 28px; }
  .avatar {
    display: block;
    width: 104px; height: 104px; border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 14px;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
  }
  h1 { font-size: 26px; font-weight: 700; line-height: 1.3; margin: 0; letter-spacing: .02em; }
  .bio { margin: 6px 0 0; color: var(--muted); font-size: 15px; text-wrap: balance; }

  .links { display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    color: inherit; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .link:hover { border-color: var(--accent); }
  .link:active { transform: scale(.985); }
  .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .pic { position: relative; flex: none; width: 54px; height: 54px; }
  .pic img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; display: block; }
  .badge {
    position: absolute; right: -5px; bottom: -5px;
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
    border: 2px solid var(--card);
  }
  .badge svg { width: 12px; height: 12px; }
  .b-yt { background: #e62117; }
  .b-tg { background: #229ed9; }
  .b-fb { background: #1877f2; }

  .text { min-width: 0; flex: 1; }
  .title { display: block; font-weight: 700; font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
  .sub { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .chev { flex: none; width: 18px; height: 18px; color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }

  @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
</style>


</head>
<body>
<main>

    <img class="avatar" src="avatar.jpg" alt="RC MC" width="104" height="104">
    <h1>RC MC</h1>

  </header>

  <ul class="links">

        </span>

          <span class="badge b-tg" aria-hidden="true"><svg viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5Z"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 13.6c2.9 0 5 1.7 5 4.4h-4.2c0-1.8-.3-3.2-.8-4.4Z"/></g></svg></span>
        </span>
        <span class="text"><span class="title">Mods Java &amp; Bedrock</span><span class="sub">ក្រុម Telegram</span></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>

      </a>
    </li>
    <li>
      <a class="link" href="https://www.facebook.com/share/1F3tYhDQeH/" target="_blank" rel="noopener">
        <span class="pic">
          <img src="fb.jpg" alt="" width="54" height="54">
          <span class="badge b-fb" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 21v-8h2.7l.5-3.2h-3.2V7.9c0-.9.3-1.6 1.7-1.6h1.6V3.4c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1v2.4H7.6V13h2.8v8h3.1Z"/></svg></span>

        <span class="text"><span class="title">RC Oreki</span><span class="sub">ទំព័រ Facebook</span></span>

  <footer>ចុចមួយដង ដើម្បីទៅកាន់ឆានែលណាមួយ</footer>
</main>
</body>
</html>
